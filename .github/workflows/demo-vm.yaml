name: Reusable GCloud Helper

on:
  workflow_call:
    inputs:
      mode:
        description: "Lifecycle mode: up, smoke, down, or e2e. e2e runs up + smoke + down(always)."
        type: string
        required: false
        default: e2e
      infra_ref:
        description: "Ref of yevgenisl/gcloud-helper to check out."
        type: string
        required: false
        default: main
      project_id:
        description: "GCP project ID."
        type: string
        required: false
        default: canaverse
      workload_identity_provider:
        description: "GCP Workload Identity Provider resource name."
        type: string
        required: false
        default: projects/370364006392/locations/global/workloadIdentityPools/github-pool/providers/github-provider
      service_account:
        description: "GCP service account to impersonate."
        type: string
        required: false
        default: github-actions-sa@canaverse.iam.gserviceaccount.com
      environment:
        description: "Environment label and tfstate path segment."
        type: string
        required: false
        default: ci
      run_id:
        description: "Stable run id for names/state. Leave empty to use gh-<github.run_id>."
        type: string
        required: false
        default: ""
      region:
        description: "GCP region."
        type: string
        required: false
        default: europe-west1
      zone:
        description: "GCP zone."
        type: string
        required: false
        default: europe-west1-b
      demo_port:
        description: "Demo health endpoint port."
        type: string
        required: false
        default: "8080"
      create_firewall_rules:
        description: "Create temporary HTTP/SSH firewall rules."
        type: boolean
        required: false
        default: false
      auto_delete_after_duration:
        description: "Enable GCP VM auto-delete safety backstop."
        type: boolean
        required: false
        default: true
      max_run_duration_seconds:
        description: "VM max runtime before GCP auto-delete. Default 3h."
        type: string
        required: false
        default: "10800"
      add_ssh_key:
        description: "Add instance-level SSH public key metadata."
        type: boolean
        required: false
        default: true
      ssh_user:
        description: "Linux username for injected public SSH key."
        type: string
        required: false
        default: runner
      public_ssh_key:
        description: "Optional public SSH key text. If empty and add_ssh_key=true, a throwaway CI key is generated."
        type: string
        required: false
        default: ""
      app_deploy:
        description: "Upload and deploy a Docker Compose app repo to the VM after provisioning."
        type: boolean
        required: false
        default: false
      app_repo:
        description: "GitHub repository to deploy. Empty means the caller repository."
        type: string
        required: false
        default: ""
      app_ref:
        description: "Git ref to deploy. Empty means the caller ref name."
        type: string
        required: false
        default: ""
      app_name:
        description: "Application name used for the remote /opt/<name> directory."
        type: string
        required: false
        default: canabis-assistant-api
      app_port:
        description: "Host port for the app compose stack. Defaults to demo_port."
        type: string
        required: false
        default: "8080"
      app_env_file:
        description: "Path (on the runner) to a file containing KEY=VALUE lines to place beside the app compose file on the VM. Use when the same job renders the .env (e.g. workflow_call expansion of a previous step's output). Takes precedence over app_env_artifact_name and secrets.app_env when set."
        type: string
        required: false
        default: ""
      app_env_artifact_name:
        description: "Name of a GitHub Actions artifact (uploaded earlier in the same workflow run by a caller job via actions/upload-artifact@v4) whose body is the .env file. Use when the .env is rendered on a separate runner (e.g. cross-job). The artifact's single file is downloaded to the runner before deploy. Takes precedence over secrets.app_env; ignored if app_env_file is also set."
        type: string
        required: false
        default: ""
      app_gar_registry:
        description: "Hostname of the private container registry to authenticate podman against before compose up (e.g. europe-west2-docker.pkg.dev). Leave empty if the compose file pulls only from docker.io."
        type: string
        required: false
        default: "europe-west2-docker.pkg.dev"
      app_gar_registry_host:
        description: "Full registry URL podman will log into. Usually https:// followed by app_gar_registry. Override only if your podman client requires a non-standard URL."
        type: string
        required: false
        default: ""
      app_compose_subdir:
        description: "Path inside the checked-out app repo that contains docker-compose.yml. Set to `deployment` for repos like lolian/superapp where compose lives under deployment/, or leave empty for repos where compose is at the repo root."
        type: string
        required: false
        default: ""
      app_image_tag:
        description: "Image tag baked into the rendered .env as API_TAG/WEB_TAG/ASSISTANT_TAG. Defaults to `latest`. Override to pin a specific build (e.g. `sha-abc1234`)."
        type: string
        required: false
        default: "latest"
      app_health_probes:
        description: "Space-separated list of HTTP URLs the VM curls to confirm the compose stack is ready. Any 2xx-4xx response counts as ready; 5xx / connection failures retry until the 5-minute budget is exhausted. Default probes cover nginx (`/`) and the superapp backend (`/api/categories`); override for non-superapp stacks."
        type: string
        required: false
        default: ""
    secrets:
      infra_repo_token:
        description: "Optional token with contents:read for checking out this private infra repo from another private repo."
        required: false
      app_env:
        description: "Optional .env file content to place beside the app compose file on the VM. Use only GitHub secrets, never plaintext workflow inputs. Lowest precedence; ignored if app_env_file or app_env_artifact_name is also provided."
        required: false
    outputs:
      run_id:
        description: "Resolved run id."
        value: ${{ jobs.demo-vm.outputs.run_id }}
      instance_name:
        description: "Created VM name."
        value: ${{ jobs.demo-vm.outputs.instance_name }}
      zone:
        description: "Created VM zone."
        value: ${{ jobs.demo-vm.outputs.zone }}
      external_ip:
        description: "Created VM external IP."
        value: ${{ jobs.demo-vm.outputs.external_ip }}
      demo_url:
        description: "Created VM public demo URL."
        value: ${{ jobs.demo-vm.outputs.demo_url }}

  workflow_dispatch:
    inputs:
      mode:
        description: "Lifecycle mode: up, smoke, down, or e2e."
        type: choice
        options: [up, smoke, down, e2e]
        required: true
        default: e2e
      run_id:
        description: "Stable run id. Leave empty to use gh-<github.run_id>."
        type: string
        required: false
        default: ""
      create_firewall_rules:
        description: "Create temporary HTTP/SSH firewall rules."
        type: boolean
        required: false
        default: false
      max_run_duration_seconds:
        description: "VM max runtime before GCP auto-delete. Default 3h."
        type: string
        required: false
        default: "10800"
      public_ssh_key:
        description: "Optional public SSH key text."
        type: string
        required: false
        default: ""
      app_deploy:
        description: "Upload and deploy the caller/app Docker Compose repo to the VM."
        type: boolean
        required: false
        default: false
      app_repo:
        description: "GitHub repository to deploy. Empty means this repository."
        type: string
        required: false
        default: ""
      app_ref:
        description: "Git ref to deploy. Empty means this ref."
        type: string
        required: false
        default: ""
      app_name:
        description: "Application name used under /opt."
        type: string
        required: false
        default: canabis-assistant-api
      app_port:
        description: "Host port for the app compose stack. Defaults to 8080."
        type: string
        required: false
        default: "8080"
      workload_identity_provider:
        description: "GCP Workload Identity Provider resource name."
        type: string
        required: false
        default: projects/370364006392/locations/global/workloadIdentityPools/github-pool/providers/github-provider
      service_account:
        description: "GCP service account to impersonate."
        type: string
        required: false
        default: github-actions-sa@canaverse.iam.gserviceaccount.com
      auto_delete_after_duration:
        description: "Enable GCP VM auto-delete safety backstop."
        type: boolean
        required: false
        default: true
      add_ssh_key:
        description: "Add instance-level SSH public key metadata."
        type: boolean
        required: false
        default: true

permissions:
  contents: read
  id-token: write

env:
  INFRA_REPO: yevgenisl/gcloud-helper
  INFRA_REF: ${{ inputs.infra_ref || 'main' }}
  PROJECT_ID: ${{ inputs.project_id || 'canaverse' }}
  REGION: ${{ inputs.region || 'europe-west1' }}
  ZONE: ${{ inputs.zone || 'europe-west1-b' }}
  ENVIRONMENT: ${{ inputs.environment || 'ci' }}
  RUN_ID: ${{ inputs.run_id != '' && inputs.run_id || format('gh-{0}', github.run_id) }}
  DEMO_PORT: ${{ inputs.demo_port }}
  START_HELPER_HEALTH: ${{ inputs.app_deploy && 'false' || 'true' }}
  CREATE_FIREWALL_RULES: ${{ inputs.create_firewall_rules }}
  AUTO_DELETE_AFTER_DURATION: ${{ inputs.auto_delete_after_duration }}
  MAX_RUN_DURATION_SECONDS: ${{ inputs.max_run_duration_seconds || '10800' }}
  ADD_SSH_KEY: ${{ inputs.add_ssh_key }}
  SSH_USER: ${{ inputs.ssh_user || 'runner' }}
  APP_DEPLOY: ${{ inputs.app_deploy }}
  APP_REPO: ${{ inputs.app_repo != '' && inputs.app_repo || github.repository }}
  APP_REF: ${{ inputs.app_ref != '' && inputs.app_ref || github.ref_name }}
  APP_NAME: ${{ inputs.app_name || 'canabis-assistant-api' }}
  APP_PORT: ${{ inputs.app_port || inputs.demo_port || '8080' }}
  GAR_REGISTRY: ${{ inputs.app_gar_registry }}
  GAR_REGISTRY_HOST: ${{ inputs.app_gar_registry_host }}

jobs:
  demo-vm:
    name: ${{ inputs.mode || 'e2e' }} demo VM
    runs-on: ubuntu-latest
    outputs:
      run_id: ${{ steps.resolve.outputs.run_id }}
      instance_name: ${{ steps.capture.outputs.instance_name }}
      zone: ${{ steps.capture.outputs.zone }}
      external_ip: ${{ steps.capture.outputs.external_ip }}
      demo_url: ${{ steps.capture.outputs.demo_url }}

    steps:
      - name: Resolve inputs
        id: resolve
        shell: bash
        run: |
          set -euo pipefail
          case "${{ inputs.mode || 'e2e' }}" in
            up|smoke|down|e2e) ;;
            *) echo "Invalid mode: ${{ inputs.mode }}" >&2; exit 2 ;;
          esac
          echo "run_id=${RUN_ID}" >> "$GITHUB_OUTPUT"
          echo "Resolved run id: ${RUN_ID}"

      - name: Checkout demo VM infra repo
        uses: actions/checkout@v4
        with:
          repository: ${{ env.INFRA_REPO }}
          ref: ${{ env.INFRA_REF }}
          path: demo-vm-infra
          token: ${{ secrets.infra_repo_token || github.token }}

      - name: Checkout app repo for compose deployment
        if: ${{ inputs.app_deploy }}
        uses: actions/checkout@v4
        with:
          repository: ${{ env.APP_REPO }}
          ref: ${{ env.APP_REF }}
          path: app-source

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2.1.7
        with:
          workload_identity_provider: ${{ inputs.workload_identity_provider || 'projects/370364006392/locations/global/workloadIdentityPools/github-pool/providers/github-provider' }}
          service_account: ${{ inputs.service_account || 'github-actions-sa@canaverse.iam.gserviceaccount.com' }}

      - name: Set up gcloud
        uses: google-github-actions/setup-gcloud@v2

      - name: Set up OpenTofu
        uses: opentofu/setup-opentofu@v1
        with:
          tofu_version: latest

      - name: Prepare SSH public key for VM metadata
        if: ${{ inputs.add_ssh_key }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/hermes-demo-ssh"
          SSH_PUBLIC_KEY_PATH="$RUNNER_TEMP/hermes-demo-ssh/id.pub"
          if [ -n "${{ inputs.public_ssh_key }}" ]; then
            printf '%s\n' "${{ inputs.public_ssh_key }}" > "$SSH_PUBLIC_KEY_PATH"
          else
            ssh-keygen -q -t ed25519 -N '' -C "github-actions-${GITHUB_RUN_ID}" -f "$RUNNER_TEMP/hermes-demo-ssh/id"
            SSH_PUBLIC_KEY_PATH="$RUNNER_TEMP/hermes-demo-ssh/id.pub"
          fi
          echo "SSH_PUBLIC_KEY_PATH=$SSH_PUBLIC_KEY_PATH" >> "$GITHUB_ENV"

      - name: Initialize OpenTofu backend
        working-directory: demo-vm-infra
        shell: bash
        run: make init

      - name: Provision demo VM
        if: ${{ inputs.mode == 'up' || inputs.mode == 'e2e' }}
        working-directory: demo-vm-infra
        shell: bash
        run: make demo-up

      - name: Capture VM outputs
        id: capture
        if: ${{ inputs.mode == 'up' || inputs.mode == 'e2e' || inputs.mode == 'smoke' }}
        working-directory: demo-vm-infra/infra/gcp-demo-vm
        shell: bash
        run: |
          set -euo pipefail
          echo "instance_name=$(tofu output -raw instance_name)" >> "$GITHUB_OUTPUT"
          echo "zone=$(tofu output -raw zone)" >> "$GITHUB_OUTPUT"
          echo "external_ip=$(tofu output -raw external_ip)" >> "$GITHUB_OUTPUT"
          echo "demo_url=$(tofu output -raw demo_url)" >> "$GITHUB_OUTPUT"

      # Resolve APP_ENV in three possible paths. The order is highest-precedence first:
      #   app_env_file > app_env_artifact_name > secrets.app_env > nothing (deploy fails
      #   fast on missing required vars). Each path is its own step so the runner injects
      #   ACTIONS_RUNTIME_TOKEN/URL into the download-artifact action's child process where
      #   it's actually used (NOT in arbitrary bash, which previously failed because
      #   the env vars weren't injected there).

      - name: Resolve app env file path (input_file priority)
        id: env_path
        if: ${{ inputs.app_deploy && (inputs.mode == 'up' || inputs.mode == 'e2e') }}
        shell: bash
        env:
          APP_ENV_INPUT_FILE: ${{ inputs.app_env_file }}
          APP_ENV_ARTIFACT_NAME: ${{ inputs.app_env_artifact_name }}
        run: |
          set -euo pipefail
          # Decide which source to use. Each output MUST be on its own line --
          # one `echo "k=v"` per line. The first 'if' branch had been
          # writing "source=artifact name=app-env-file" as a SINGLE line,
          # which GitHub parsed as `source`="artifact name=app-env-file"
          # (the rest of the line becomes the value), and the
          # `steps.env_path.outputs.source == 'artifact'` equality check
          # silently evaluated to false. The Fetch steps then all skipped,
          # the env file was never written, and podman-compose bailed
          # at substitution time -- the original
          # "JWT_SECRET must be set" failure mode in disguise.
          #
          # Regression: lolian/superapp#28753259094
          #
          # Sources in priority order:
          #   1. app_env_file       (runner-rendered .env path)
          #   2. app_env_artifact_name (cross-runner artifact; typically
          #      produced by a separate render-env-from-gsm job on a
          #      different runner, with secrets pulled from Google
          #      Secret Manager so they never touch GitHub)
          #   3. secrets.app_env    (full .env in a GH secret — last
          #      resort only; prefer GSM)
          #   4. nothing (safe-default .env with MOCK_LLM=true is
          #      generated on the VM)
          if [ -n "$APP_ENV_INPUT_FILE" ]; then
            echo "source=input_file" >> "$GITHUB_OUTPUT"
            echo "name=$APP_ENV_INPUT_FILE" >> "$GITHUB_OUTPUT"
            echo "fetch=true" >> "$GITHUB_OUTPUT"
          elif [ -n "$APP_ENV_ARTIFACT_NAME" ]; then
            echo "source=artifact" >> "$GITHUB_OUTPUT"
            echo "name=$APP_ENV_ARTIFACT_NAME" >> "$GITHUB_OUTPUT"
            echo "fetch=true" >> "$GITHUB_OUTPUT"
          else
            echo "source=none" >> "$GITHUB_OUTPUT"
            echo "name=" >> "$GITHUB_OUTPUT"
            echo "fetch=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Fetch app env (file input)
        if: ${{ steps.env_path.outputs.source == 'input_file' }}
        shell: bash
        run: |
          set -euo pipefail
          src="${{ steps.env_path.outputs.path }}"
          if [ ! -f "$src" ]; then
            echo "::error::app_env_file input points at non-existent path: $src"
            exit 1
          fi
          install -m 0600 "$src" "$RUNNER_TEMP/app.env"
          echo "Read app_env_file: $src ($(wc -l < "$RUNNER_TEMP/app.env") lines)"

      - name: Fetch app env (artifact)
        # `actions/download-artifact` is the canonical way to read cross-job
        # artifacts. It handles ACTIONS_RUNTIME_TOKEN/URL internally. Don't
        # try to do this with curl + bash + those env vars -- they are not
        # guaranteed to be injected into bash processes. (Regression:
        # lolian/superapp#28752851868)
        if: ${{ steps.env_path.outputs.source == 'artifact' }}
        uses: actions/download-artifact@v4
        with:
          name: ${{ steps.env_path.outputs.name }}
          path: ${{ runner.temp }}/app-env-artifact
          # GITHUB_TOKEN is auto-injected by the action; we don't need to declare it.

      - name: Fetch app env (secrets.app_env fallback)
        if: ${{ steps.env_path.outputs.source == 'none' }}
        shell: bash
        env:
          APP_ENV_CONTENT: ${{ secrets.app_env }}
        run: |
          set -euo pipefail
          if [ -z "$APP_ENV_CONTENT" ]; then
            echo "No APP_ENV_FILE set; relying on compose to fail-fast on missing required vars."
            exit 0
          fi
          printf '%s\n' "$APP_ENV_CONTENT" > "$RUNNER_TEMP/app.env"
          chmod 0600 "$RUNNER_TEMP/app.env"

      - name: Normalize downloaded artifact to $RUNNER_TEMP/app.env
        # When the source is `artifact`, download-artifact@v4 dumps the contents
        # into a directory. Walk that directory to find the .env file, and
        # rename it to the canonical $RUNNER_TEMP/app.env path that the
        # deploy-compose script expects.
        if: ${{ steps.env_path.outputs.source == 'artifact' }}
        shell: bash
        run: |
          set -euo pipefail
          EXTRACT_DIR="$RUNNER_TEMP/app-env-artifact"
          if [ ! -d "$EXTRACT_DIR" ]; then
            echo "::error::Artifact download failed: $EXTRACT_DIR does not exist"
            exit 1
          fi
          FOUND="$(find "$EXTRACT_DIR" -type f -name '*.env' | head -n1)"
          if [ -z "$FOUND" ]; then
            FOUND="$(find "$EXTRACT_DIR" -type f | head -n1)"
          fi
          if [ -z "$FOUND" ]; then
            echo "::error::Artifact ${{ steps.env_path.outputs.name }} contained no file"
            exit 1
          fi
          install -m 0600 "$FOUND" "$RUNNER_TEMP/app.env"
          echo "Normalized artifact env: $FOUND -> $RUNNER_TEMP/app.env ($(wc -l < "$RUNNER_TEMP/app.env") lines)"

      - name: Export APP_ENV_FILE for downstream steps
        if: ${{ inputs.app_deploy && (inputs.mode == 'up' || inputs.mode == 'e2e') }}
        shell: bash
        run: |
          set -euo pipefail
          if [ ! -s "$RUNNER_TEMP/app.env" ]; then
            # Nothing to export; downstream deploy will rely on compose's fail-fast.
            echo "No APP_ENV_FILE produced by any source."
            exit 0
          fi
          echo "APP_ENV_FILE=$RUNNER_TEMP/app.env" >> "$GITHUB_ENV"

      - name: Mint short-lived GAR access token for the VM
        # Compose services reference images in a private Artifact
        # Registry. Podman on a fresh Fedora VM has no registry auth, so
        # the first pull would fail with "unauthorized: anonymous users".
        #
        # WIF is already authenticated earlier in the job by
        # google-github-actions/auth@v2.1.7. The configured service
        # account already has roles/artifactregistry.writer (which
        # implies roles/artifactregistry.reader for the same scope), so
        # we mint a one-hour OAuth access token for it via
        # `gcloud auth print-access-token`.
        #
        # On the VM, deploy-compose-on-vm.sh reads the token from a
        # scp'd file, writes it to /tmp/.gar-token, and pipes it into
        # `podman login -u oauth2accesstoken --password-stdin`. After the
        # podman login, the file is deleted. The token scope is whatever
        # the SA's IAM role allows — for hermess-sa that's GAR
        # reader/writer; it's not privileged enough to do anything
        # outside the registry.
        id: gar_token
        if: ${{ inputs.app_deploy && (inputs.mode == 'up' || inputs.mode == 'e2e') && inputs.app_gar_registry != '' }}
        shell: bash
        env:
          GAR_REGISTRY: ${{ inputs.app_gar_registry }}
          GAR_REGISTRY_HOST: ${{ inputs.app_gar_registry_host }}
          RUNNER_TEMP: ${{ runner.temp }}
        run: |
          set -euo pipefail
          : "${GAR_REGISTRY:=europe-west2-docker.pkg.dev}"
          GAR_REGISTRY_HOST_VALUE="${GAR_REGISTRY_HOST:-https://${GAR_REGISTRY}}"
          if [ ! -s "$GOOGLE_APPLICATION_CREDENTIALS" ]; then
            echo "::error::WIF credentials not present at \$GOOGLE_APPLICATION_CREDENTIALS" >&2
            exit 1
          fi
          echo "Minting GAR access token for ${GAR_REGISTRY_HOST_VALUE}"
          ACCESS_TOKEN="$(gcloud auth print-access-token)"
          GAR_TOKEN_FILE="$RUNNER_TEMP/gar-token.json"
          printf '%s' "$ACCESS_TOKEN" > "$GAR_TOKEN_FILE"
          echo "gar_registry_host=$GAR_REGISTRY_HOST_VALUE" >> "$GITHUB_OUTPUT"
          echo "token_path=$GAR_TOKEN_FILE" >> "$GITHUB_OUTPUT"
          # Best-effort cleanup; the file is in $RUNNER_TEMP which gets
          # purged at the end of the job regardless.
          echo "Token file: $GAR_TOKEN_FILE ($(wc -c < "$GAR_TOKEN_FILE") bytes, 1 h validity)"

      - name: Deploy app Docker Compose stack to VM
        if: ${{ inputs.app_deploy && (inputs.mode == 'up' || inputs.mode == 'e2e') }}
        working-directory: demo-vm-infra
        shell: bash
        env:
          # Optional GAR token, produced by the step above. Empty string
          # when app_gar_registry is unset.
          GAR_TOKEN_FILE: ${{ steps.gar_token.outputs.token_path || '' }}
        run: |
          set -euo pipefail
          APP_SOURCE_DIR="$GITHUB_WORKSPACE/app-source" \
          APP_NAME="$APP_NAME" \
          APP_PORT="$APP_PORT" \
          GAR_REGISTRY="${GAR_REGISTRY:-}" \
          GAR_REGISTRY_HOST="${GAR_REGISTRY_HOST:-https://${GAR_REGISTRY:-}}" \
          REMOTE_APP_DIR="/opt/$APP_NAME" \
          COMPOSE_SUBDIR="${{ inputs.app_compose_subdir }}" \
          APP_IMAGE_TAG="${{ inputs.app_image_tag }}" \
          APP_HEALTH_PROBES="${{ inputs.app_health_probes }}" \
          make deploy-compose

      - name: Smoke test demo VM
        if: ${{ inputs.mode == 'smoke' || inputs.mode == 'e2e' }}
        working-directory: demo-vm-infra
        shell: bash
        env:
          APP_HEALTH_PROBES: ${{ inputs.app_health_probes }}
        run: make demo-smoke

      - name: Destroy demo VM
        if: ${{ inputs.mode == 'down' || (inputs.mode == 'e2e' && always()) }}
        working-directory: demo-vm-infra
        shell: bash
        run: make demo-down

      # Always push the latest local state to GCS and emit a workflow
      # artifact, so a partial apply (or a runner abort) never strands
      # state only on disk. Idempotent and runs even if upstream failed.
      - name: Upload tofu state snapshot (always)
        if: ${{ always() }}
        working-directory: demo-vm-infra
        shell: bash
        run: make tofu-state-snapshot || true

      - name: Upload tofu state backups to workflow artifacts
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: tofu-state-backups-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/hermes-tofu-state-backups/**
            demo-vm-infra/infra/gcp-demo-vm/terraform.tfstate
          if-no-files-found: ignore
          retention-days: 30
