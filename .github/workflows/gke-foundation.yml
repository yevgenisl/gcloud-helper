name: GKE foundation (offline)
on:
  pull_request:
    paths: ['infra/gcp-demo-gke/**', 'scripts/**', 'tests/**', '.github/workflows/gke-foundation.yml']
  push:
    branches: [main]
    paths: ['infra/gcp-demo-gke/**', 'scripts/**', 'tests/**', '.github/workflows/gke-foundation.yml']
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: opentofu/setup-opentofu@9d84900f3238fab8cd84ce47d658d25dd008be2f # v1
        with:
          tofu_version: 1.12.3
          tofu_wrapper: false
      - run: python3 -m unittest discover -s infra/gcp-demo-gke/tests -v
      - run: tofu -chdir=infra/gcp-demo-gke init -backend=false -lockfile=readonly
      - run: tofu -chdir=infra/gcp-demo-gke fmt -check -recursive
      - run: tofu -chdir=infra/gcp-demo-gke validate
      - run: tofu -chdir=infra/gcp-demo-gke test
      - run: tofu -chdir=infra/gcp-demo-gke test -json -verbose > /tmp/gke-mock.jsonl
      - run: python3 infra/gcp-demo-gke/tests/check_mock_plans.py /tmp/gke-mock.jsonl
      - run: for t in tests/*.sh; do bash "$t"; done
