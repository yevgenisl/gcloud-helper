name: GCP demo VM smoke via reusable workflow

on:
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  demo-vm-e2e:
    uses: yevgenisl/gcp-ephemeral-demo-vm/.github/workflows/demo-vm.yaml@main
    with:
      mode: e2e
      environment: ci
      run_id: ${{ github.event.repository.name }}-${{ github.run_id }}
      create_firewall_rules: false
      max_run_duration_seconds: "10800"

